name: Falabella Bicycle Scraper CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código fuente
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalación de Google Chrome en Runner Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable

    - name: Instalación de dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Pruebas Automatizadas (CI)
      run: |
        pytest test_scraper.py -v

    - name: Ejecutar Scraper de Bicicletas
      run: |
        python main.py

    - name: Publicación del Artefacto CSV (CD)
      uses: actions/upload-artifact@v4
      with:
        name: dataset-bicicletas-falabella
        path: productos_falabella_bicicletas.csv
        retention-days: 30
